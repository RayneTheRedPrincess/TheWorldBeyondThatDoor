<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#211a13">
  <meta name="description" content="That World Beyond the Door — Return Home. Step Beyond. Begin Again.">
  <title>That World Beyond the Door</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" sizes="192x192">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell" id="app">
    <section class="title-card" aria-labelledby="game-title">
      <p class="eyebrow">Every Door Opens Onto Another World.</p>
      <h1 id="game-title">That World Beyond the Door</h1>
      <p class="tagline">Return Home. Step Beyond. Begin Again.</p>

      <div class="door-frame" aria-hidden="true">
        <div class="door">
          <span class="door-mark"></span>
        </div>
      </div>

      <button class="primary-button" id="enter-button" type="button">
        Enter the Tavern
      </button>
      <p class="status-text" id="status-text" aria-live="polite">
        Adventure Begins Beyond the Tavern.
      </p>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
